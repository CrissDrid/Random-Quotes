<!DOCTYPE html>
<html lang="en">
  <link>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="Styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <title>Random Quote | devChallenges.io</title>
  </head>
  <body>
    <div class="quote-container">
      <div class="quote">
        <p class="quote-author">George Bernard Shaw</p>
        <span class="quote-tags">
          <span class="quote-tag">Famous Quotes</span>
          <span class="quote-tag">Inspirational</span>
        </span>
        <h3 class="quote-text">
          &ldquo;Learn from yesterday, live for today, hope for tomorrow.&rdquo;
        </h3>
      </div>
    </div>
    <div class="buttons-quote">
      <button class="random-quote">
        Random
        <img src="resources/regroup.svg" alt="Random icon" class="icon" />
      </button>
      <button class="share-quote">
        Share
        <img src="resources/link.svg" alt="Share icon" class="icon" />
      </button>
    </div>
    <div class="author-info">
      Coded by <a href="https://github.com/CrissDrid/Random-Quotes" target="_blank">CrissD</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
  <script src="Script.js"></script>
</html>
